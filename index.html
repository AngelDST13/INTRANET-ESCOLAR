<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intranet Escolar — Iniciar Sesión</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

  <div class="login-card glass-card">
    <div class="login-header">
      <div class="brand-logo brand-logo--inline">IE</div>
      <h2>Intranet Escolar</h2>
      <p class="subtitle">Ingresa tus credenciales para acceder</p>
    </div>

    <form id="loginForm" class="login-form">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" placeholder="Ej. Joshi, admin, prof_mario" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <div class="form-group">
        <label for="role">Tipo de Usuario</label>
        <select id="role" required>
          <option value="admin">Administrador / Dirección</option>
          <option value="docente" selected>Docente / Profesor</option>
          <option value="estudiante">Estudiante / Padre de Familia</option>
        </select>
      </div>

      <button type="submit" class="btn-action btn-full btn-margin-top">Iniciar Sesión</button>
    </form>
  </div>

  <script src="auth.js"></script>
</body>
</html>
