<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colegio Eton — Acceso Institucional</title>
  <!-- Iconos FontAwesome v6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-badge">ETON</div>
        <h1>Colegio Eton</h1>
        <p class="subtitle">Intranet Escolar — Plataforma Académica</p>
      </div>

      <!-- Selector de Pestañas -->
      <div class="auth-tabs">
        <button type="button" class="tab-btn active" id="tabLoginBtn">
          <i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión
        </button>
        <button type="button" class="tab-btn" id="tabRegisterBtn">
          <i class="fa-solid fa-user-plus"></i> Crear Cuenta
        </button>
      </div>

      <!-- Formulario de Inicio de Sesión -->
      <form id="loginForm" class="auth-form active">
        <div class="form-group">
          <label for="loginRole"><i class="fa-solid fa-user-shield"></i> Ingresar como</label>
          <select id="loginRole" required>
            <option value="admin">Administrador</option>
            <option value="docente">Docente / Profesor</option>
            <option value="estudiante" selected>Estudiante</option>
            <option value="padre">Padre de Familia / Encargado</option>
          </select>
        </div>

        <div class="form-group">
          <label for="loginUsername"><i class="fa-solid fa-user"></i> Nombre de Usuario</label>
          <input type="text" id="loginUsername" placeholder="Ej. amartinez" required>
        </div>

        <div class="form-group">
          <label for="loginPassword"><i class="fa-solid fa-key"></i> Contraseña</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-primary">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Ingresar al Sistema
        </button>
      </form>

      <!-- Formulario de Registro -->
      <form id="registerForm" class="auth-form" style="display: none;">
        <div class="form-group">
          <label for="regFullName"><i class="fa-solid fa-id-card"></i> Nombre Completo</label>
          <input type="text" id="regFullName" placeholder="Ej. Ana Martínez" required>
        </div>

        <div class="form-group">
          <label for="regUsername"><i class="fa-solid fa-user"></i> Nombre de Usuario</label>
          <input type="text" id="regUsername" placeholder="Ej. amartinez" required>
        </div>

        <div class="form-group">
          <label for="regRole"><i class="fa-solid fa-user-shield"></i> Rol Institucional</label>
          <select id="regRole" required>
            <option value="estudiante">Estudiante</option>
            <option value="docente">Docente / Profesor</option>
            <option value="padre">Padre de Familia / Encargado</option>
            <option value="admin">Administrador</option>
          </select>
        </div>

        <div class="form-group">
          <label for="regPassword"><i class="fa-solid fa-lock"></i> Contraseña</label>
          <input type="password" id="regPassword" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-primary">
          <i class="fa-solid fa-check"></i> Registrar Cuenta
        </button>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
