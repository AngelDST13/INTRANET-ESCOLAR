<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colegio Eton — Acceso Institucional</title>
  <!-- Iconos FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- CSS del proyecto -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- BOTÓN MODO NOCHE / DÍA (ESQUINA SUPERIOR DERECHA) -->
  <div class="theme-container">
    <button class="theme-toggle-btn" id="themeToggleBtn" type="button">
      <i class="fa-solid fa-moon" id="themeIcon"></i>
      <span id="themeText">Modo Noche</span>
    </button>
  </div>

  <div class="login-container">
    <!-- Encabezado -->
    <header class="header">
      <span class="brand-tag">Eton</span>
      <h1 id="formTitle">Colegio Eton</h1>
      <p id="formSubtitle">Intranet Escolar — Plataforma Académica</p>
    </header>

    <!-- Pestañas para cambiar entre Login y Registro -->
    <div class="tabs">
      <button class="tab-btn active" id="tabLogin" type="button">
        <i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión
      </button>
      <button class="tab-btn" id="tabRegister" type="button">
        <i class="fa-solid fa-user-plus"></i> Crear Cuenta
      </button>
    </div>

    <!-- Formulario -->
    <form id="authForm">
      
      <!-- Campo adicional para Registro -->
      <div class="form-group" id="groupFullName" style="display: none;">
        <label for="fullName">
          <i class="fa-solid fa-id-card"></i> Nombre Completo
        </label>
        <input type="text" id="fullName" class="input-control" placeholder="Ej. Ana Martínez">
      </div>

      <!-- Selector de Rol -->
      <div class="form-group">
        <label for="rol">
          <i class="fa-solid fa-user-tag"></i> Ingresar como
        </label>
        <select id="rol" class="input-control">
          <option value="estudiante">Estudiante</option>
          <option value="padre">Padre / Tutor</option>
          <option value="docente">Docente</option>
          <option value="administrador">Administrador</option>
        </select>
      </div>

      <!-- Nombre de Usuario / Correo -->
      <div class="form-group">
        <label for="username" id="labelUsername">
          <i class="fa-solid fa-user"></i> Nombre de Usuario
        </label>
        <input type="text" id="username" class="input-control" placeholder="Ej. amartinez" required>
      </div>

      <!-- Contraseña -->
      <div class="form-group">
        <label for="password">
          <i class="fa-solid fa-key"></i> Contraseña
        </label>
        <input type="password" id="password" class="input-control" placeholder="••••••••" required>
      </div>

      <!-- Botón dinámico -->
      <button type="submit" class="btn-submit" id="btnSubmit">
        <i class="fa-solid fa-arrow-right-to-bracket" id="btnIcon"></i> 
        <span id="btnText">Ingresar al Sistema</span>
      </button>
    </form>
  </div>

  <!-- Lógica en JS integrada para el Login y Modo Noche -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. ALTERNAR PESTAÑAS (LOGIN / REGISTRO)
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');
      const groupFullName = document.getElementById('groupFullName');
      const btnText = document.getElementById('btnText');
      const btnIcon = document.getElementById('btnIcon');
      const authForm = document.getElementById('authForm');
      const fullNameInput = document.getElementById('fullName');

      let isRegisterMode = false;

      tabRegister.addEventListener('click', () => {
        if (isRegisterMode) return;
        isRegisterMode = true;
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        groupFullName.style.display = 'block';
        fullNameInput.required = true;
        btnText.textContent = 'Registrar Cuenta';
        btnIcon.className = 'fa-solid fa-user-check';
      });

      tabLogin.addEventListener('click', () => {
        if (!isRegisterMode) return;
        isRegisterMode = false;
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        groupFullName.style.display = 'none';
        fullNameInput.required = false;
        btnText.textContent = 'Ingresar al Sistema';
        btnIcon.className = 'fa-solid fa-arrow-right-to-bracket';
      });

      // Redirección al presionar Ingresar
      authForm.addEventListener('submit', (e) => {
        e.preventDefault();
        window.location.href = 'dashboard.html';
      });

      // 2. MODO DÍA / NOCHE GLOBAL
      const themeToggleBtn = document.getElementById('themeToggleBtn');
      const themeIcon = document.getElementById('themeIcon');
      const themeText = document.getElementById('themeText');

      function applyTheme(isDark) {
        if (isDark) {
          document.documentElement.classList.add('dark-mode');
          document.body.classList.add('dark-mode');
          if (themeText) themeText.textContent = 'Modo Día';
          if (themeIcon) themeIcon.className = 'fa-solid fa-sun';
        } else {
          document.documentElement.classList.remove('dark-mode');
          document.body.classList.remove('dark-mode');
          if (themeText) themeText.textContent = 'Modo Noche';
          if (themeIcon) themeIcon.className = 'fa-solid fa-moon';
        }
      }

      // Cargar preferencia guardada
      if (localStorage.getItem('theme') === 'dark') {
        applyTheme(true);
      }

      if (themeToggleBtn) {
        themeToggleBtn.addEventListener('click', () => {
          const isDark = !document.body.classList.contains('dark-mode');
          applyTheme(isDark);
          localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
      }
    });
  </script>
</body>
</html>
