<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intranet Escolar — Panel Principal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="dashboard-container">
    <header class="navbar">
      <h2>Intranet Escolar</h2>
      <div class="user-info">
        <span id="welcomeUser">Cargando...</span>
        <button id="logoutBtn" class="btn-logout">Cerrar Sesión</button>
      </div>
    </header>

    <main class="content">
      <!-- Módulo de Comunicados General -->
      <section class="card">
        <h3>Tablón de Comunicados e Avisos</h3>
        <ul id="announcementsList" class="data-list"></ul>

        <!-- Formulario para publicar aviso (Solo Admin y Docentes) -->
        <form id="addNoticeForm" style="display: none; margin-top: 1rem;">
          <div class="form-group">
            <input type="text" id="noticeInput" placeholder="Escribe un comunicado o aviso oficial..." required>
          </div>
          <button type="submit" class="btn-action">+ Publicar Aviso</button>
        </form>
      </section>

      <!-- Módulo de Administración: Gestión de Usuarios -->
      <section id="adminSection" class="card role-section" style="display: none;">
        <h3>Gestión de Usuarios (Administración)</h3>
        <form id="addUserForm" style="margin-bottom: 1rem;">
          <div class="form-group">
            <label for="newUsername">Nombre de Usuario</label>
            <input type="text" id="newUsername" placeholder="Ej. juan_perez" required>
          </div>
          <div class="form-group">
            <label for="newUserRole">Rol asignado</label>
            <select id="newUserRole" required>
              <option value="docente">Docente</option>
              <option value="estudiante">Estudiante / Familia</option>
            </select>
          </div>
          <button type="submit" class="btn-action">+ Registrar Usuario</button>
        </form>

        <h4>Usuarios Registrados</h4>
        <ul id="usersList" class="data-list" style="margin-top: 0.5rem;"></ul>
      </section>

      <!-- Módulo Docente: Registro de Calificaciones -->
      <section id="teacherSection" class="card role-section" style="display: none;">
        <h3>Módulo Académico — Registro de Calificaciones</h3>
        <form id="addGradeForm">
          <div class="form-group">
            <label for="studentName">Nombre del Estudiante</label>
            <input type="text" id="studentName" placeholder="Ej. Ana Gómez" required>
          </div>
          <div class="form-group">
            <label for="subjectName">Asignatura</label>
            <input type="text" id="subjectName" placeholder="Ej. Matemáticas" required>
          </div>
          <div class="form-group">
            <label for="gradeScore">Calificación (0 - 100)</label>
            <input type="number" id="gradeScore" min="0" max="100" placeholder="Ej. 95" required>
          </div>
          <button type="submit" class="btn-action">Guardar Calificación</button>
        </form>
      </section>

      <!-- Módulo Estudiante / Familia: Consulta de Notas -->
      <section id="studentSection" class="card role-section" style="display: none;">
        <h3>Boleta de Calificaciones (Estudiantes / Familias)</h3>
        <table class="data-table">
          <thead>
            <tr>
              <th>Estudiante</th>
              <th>Asignatura</th>
              <th>Calificación</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="gradesTableBody">
            <!-- Se cargan dinámicamente -->
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
